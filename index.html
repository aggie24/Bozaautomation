  <div class="card p"><div class="lbl mb8">By plan</div>${Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="mb8"><div class="row sb"><span>${h(k)}</span><span class="sub">${v.n} • ${kes(v.v)}</span></div><div class="bar"><i style="width:${v.n/mx*100}%"></i></div></div>`).join(''):'<div class="sub">No completed transactions yet.</div>'}</div>`}};

/* ---------- ONLINE STORE ---------- */
R.store={title:'Online Store',acts:()=>`<button class="ib" data-act="storeSync"><span class="ms s">refresh</span></button>`,render(){const s=S.store;
  return `<div class="lbl" style="margin:8px 4px">Connect with PAT</div><div class="card p"><div class="row"><span class="ms">key</span><div><b style="font-weight:600">${s.connected?'Connected':'Not connected'}</b><div class="tiny">${s.connected?'Last sync: '+(s.lastSync?rel(s.lastSync):'never'):'Paste your token to link your store'}</div></div></div>
  <div class="search" style="margin-top:14px"><span class="ms s">key</span><input id="pat" type="password" placeholder="Personal Access Token (PAT)" value="${h(s.pat)}"><button class="ib sm" data-act="patEye"><span class="ms s">visibility</span></button><button class="ib sm" data-act="patPaste"><span class="ms s">content_paste</span></button></div>
  <div class="row"><button class="btn g f1" data-act="patSave">${s.connected?'Update PAT':'Save PAT'}</button><button class="btn o f1" data-act="patHelp">Help</button></div>
  ${s.connected?`<button class="btn sm mt" data-act="patDisconnect"><span class="ms s">link_off</span>Disconnect</button>`:''}<div class="tiny mt">Get your PAT from the Developers page on your store dashboard.</div></div>
  ${s.connected?`<div class="card p"><div class="lbl mb8">Store sync</div><div class="sub">${S.plans.filter(p=>p.enabled).length} active plans published • Orders paid online are processed by automation like M-PESA payments.</div><button class="btn sm mt" data-act="storeOrder"><span class="ms s">shopping_cart</span>Simulate online order</button></div>`:''}`}};
A.patEye=()=>{const i=$('#pat');i.type=i.type==='password'?'text':'password'};
A.patPaste=async()=>{try{$('#pat').value=await navigator.clipboard.readText()}catch(e){toast('Clipboard not available — paste manually')}};
A.patSave=()=>{const v=$('#pat').value.trim();if(v.length<16){toast('PAT looks too short (min 16 characters)');return}S.store={pat:v,connected:true,lastSync:now()};save();render();toast('Store connected')};
A.patDisconnect=()=>confirmBox('Disconnect your online store?',()=>{S.store={pat:'',connected:false,lastSync:0};save();render()},'Disconnect');
A.patHelp=()=>modal('Connecting your store',`<ol class="steps"><li><i>1</i>Sign in to your store dashboard.</li><li><i>2</i>Open <b>Developers</b> → <b>Personal Access Tokens</b>.</li><li><i>3</i>Create a token with <span class="mono">orders</span> and <span class="mono">plans</span> scopes.</li><li><i>4</i>Paste it here and tap Save PAT.</li></ol>`);
A.storeSync=()=>{if(!S.store.connected){toast('Connect your store first');return}S.store.lastSync=now();save();render();toast('Store synced')};
A.storeOrder=()=>{const p=S.plans.filter(x=>x.enabled)[0];processPayment({code:'WEB'+Math.random().toString(36).slice(2,9).toUpperCase(),amount:p.price,name:'ONLINE ORDER',phone:'0712000111'});render()};

/* ---------- PLANS ---------- */
const cats=()=>[...new Set(S.plans.map(p=>p.category))];
R.plans={title:'Data Plans Manager',acts:()=>`<button class="ib" data-act="bulkPrice" title="Bulk price adjust"><span class="ms s">percent</span></button><button class="ib" data-act="planEdit"><span class="ms">add</span></button>`,render(){const f=S.ui.pcat||'All';
  const l=S.plans.filter(p=>f==='All'||p.category===f);
  return `<div class="chips">${['All',...cats()].map(c=>`<span class="chip ${f===c?'on':''}" data-act="chip" data-k="pcat" data-v="${h(c)}">${f===c?'<span class="ms xs">check</span>':''}${h(c)}</span>`).join('')}</div>
  ${l.map(p=>`<div class="card p"><div class="row sb"><b style="font-weight:500;font-size:15px">${h(p.name)}</b><button class="ib sm" data-act="planMenu" data-id="${p.id}"><span class="ms s">more_vert</span></button></div>
   <div class="row wrap gap6 mt"><span class="c-blue tiny">${h(p.category)}</span><span class="ms s ${p.sigLearned?'fill c-green':''}" title="Signature">${p.sigLearned?'verified':'pending'}</span><span class="ms s" title="Schedule">schedule</span><span class="ms s ${p.type==='Advanced'?'':'c-blue'}">contrast</span><span class="pill ${p.signature?'g':''}"><span class="ms xs">${p.signature?'check_circle':'cancel'}</span>Signature: ${p.signature?'On':'Off'}</span></div>
   <div class="row wrap gap6 mt"><span class="pill ${p.enabled?'g':'r'}" data-act="planToggle" data-id="${p.id}" style="cursor:pointer"><span class="ms xs">${p.enabled?'check_circle':'block'}</span>${p.enabled?'Enabled':'Disabled'}</span><span class="pill"><span class="ms xs">stars</span>${p.points?`Points: +${p.pointsEarn} • req ${p.pointsReq}`:'Points: Off'}</span></div>
   <div class="kv"><div class="k"><span class="ms">dialpad</span><div><small>USSD</small><span class="mono">${h(p.ussd)}</span></div></div><div class="k"><span class="ms">payments</span><div><small>Payment Mode</small>${h(p.paymentMode)}</div></div>
   <div class="k"><span class="ms">sell</span><div><small>Selling Price</small>${kes(p.price)}</div></div><div class="k"><span class="ms">price_check</span><div><small>Safaricom Price</small>${kes(p.saf)}</div></div>
   <div class="k"><span class="ms">sim_card</span><div><small>Execute SIM</small>${h(p.execSim)}</div></div><div class="k"><span class="ms">sms</span><div><small>Notification SIM</small>${h(p.notifSim)}</div></div>
   <div class="k"><span class="ms">autorenew</span><div><small>Auto Retry</small>${p.retryOn?`On • ${p.retry}x • Pending/Failed`:'Off'}</div></div><div class="k"><span class="ms">category</span><div><small>Type</small>${h(p.type)}</div></div></div>
   <div class="tiny mt">Last updated: ${fmtIso(p.updated)}</div></div>`).join('')||empty('data_saver_on','No plans','Tap + to add your first plan.')}
  <button class="btn g fab" data-act="sharePlans"><span class="ms s">share</span>Share plans</button>`}};
A.planToggle=d=>guard('plans',()=>{const p=planById(d.id);p.enabled=!p.enabled;p.updated=now();save();render();if(p.enabled&&S.automation){S.transactions.filter(t=>t.status==='pending'&&t.planId===p.id).forEach(runTx)}});
A.planMenu=(d,el)=>{const p=planById(d.id);popMenu(el,[{label:'Edit',icon:'edit',fn:()=>A.planEdit({id:p.id})},{label:p.enabled?'Disable':'Enable',icon:p.enabled?'block':'check_circle',fn:()=>A.planToggle(d)},{label:'Test in USSD Console',icon:'terminal',fn:()=>{S.ui.cPlan=p.id;go('console')}},{label:'Learn signature',icon:'verified',fn:async()=>{toast('Learning signature with '+S.settings.sigNumber+'…');await sleep(1200);p.sigLearned=true;p.updated=now();save();render();toast('Signature learned for '+p.name)}},{label:'Duplicate',icon:'content_copy',fn:()=>{S.plans.push({...p,id:uid(),name:p.name+' (copy)',updated:now()});save();render()}},{label:'Delete',icon:'delete',danger:true,fn:()=>guard('plans',()=>confirmBox(`Delete plan "${h(p.name)}"?`,()=>{S.plans=S.plans.filter(x=>x!==p);S.fallbacks.maps=S.fallbacks.maps.filter(m=>m.from!==p.id&&m.to!==p.id);save();render()},'Delete'))}])};
A.planEdit=d=>{const p=d&&d.id?planById(d.id):{name:'',category:S.ui.pcat&&S.ui.pcat!=='All'?S.ui.pcat:'Data',ussd:'*180*5*2*pn*1*1#',price:'',saf:'',execSim:'SIM 1',notifSim:'SIM 1',paymentMode:'Till SIM',retryOn:true,retry:3,type:'Advanced',enabled:true,signature:true,points:false,pointsEarn:0,pointsReq:0};
  modal(d&&d.id?'Edit plan':'New plan',`${fld('Plan name',inp('name',p.name,'e.g. 1gb valid 1hr'))}
  <div class="row">${fld('Category',`<input class="inp" name="category" list="catlist" value="${h(p.category)}"><datalist id="catlist">${opt(cats())}</datalist>`).replace('class="fld"','class="fld f1"')}${fld('Type',`<select class="inp sel" name="type">${opt(['Simple','Advanced'],p.type)}</select>`).replace('class="fld"','class="fld f1"')}</div>
  ${fld('USSD code (use <span class="mono">pn</span> for customer number)',inp('ussd',p.ussd,'*180*5*2*pn*1*1#'))}
  <div class="row">${fld('Selling price',inp('price',p.price,'20','number')).replace('class="fld"','class="fld f1"')}${fld('Safaricom price',inp('saf',p.saf,'20','number')).replace('class="fld"','class="fld f1"')}</div>
  <div class="row">${fld('Execute SIM',`<select class="inp sel" name="execSim">${opt(['SIM 1','SIM 2'],p.execSim)}</select>`).replace('class="fld"','class="fld f1"')}${fld('Notification SIM',`<select class="inp sel" name="notifSim">${opt(['SIM 1','SIM 2'],p.notifSim)}</select>`).replace('class="fld"','class="fld f1"')}</div>
  ${fld('Payment mode',`<select class="inp sel" name="paymentMode">${opt(['Till SIM','Paybill SIM','M-Pesa SIM','Online Store'],p.paymentMode)}</select>`)}
  <div class="row sb mb8"><span>Auto retry</span>${sw('retryOn',p.retryOn)}</div>${fld('Retry attempts',inp('retry',p.retry,'3','number','min="1" max="20"'))}
  <div class="row sb mb8"><span>Signature check</span>${sw('signature',p.signature)}</div><div class="row sb mb8"><span>Enabled</span>${sw('enabled',p.enabled)}</div>
  <div class="row sb mb8"><span>Loyalty points</span>${sw('points',p.points)}</div><div class="row">${fld('Points earned',inp('pointsEarn',p.pointsEarn,'0','number')).replace('class="fld"','class="fld f1"')}${fld('Points required to redeem',inp('pointsReq',p.pointsReq,'0','number')).replace('class="fld"','class="fld f1"')}</div>`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(!v.name.trim()||!v.ussd.trim()||v.price===''){toast('Name, USSD and price are required');return false}
    if(!/pn/.test(v.ussd))toast('Note: USSD has no "pn" placeholder');
    const o={...v,name:v.name.trim(),category:v.category.trim()||'Data',price:+v.price,saf:+(v.saf||v.price),retry:+v.retry||1,pointsEarn:+v.pointsEarn||0,pointsReq:+v.pointsReq||0,updated:now()};
    if(d&&d.id)Object.assign(p,o);else S.plans.push({id:uid(),sigLearned:false,...o});save();render();toast('Plan saved')}}])};
A.bulkPrice=()=>modal('Bulk price adjust',`${fld('Category',`<select class="inp sel" name="cat">${opt(['All',...cats()])}</select>`)}${fld('Change selling price by (%)',inp('pct','10','e.g. 10 or -5','number'))}${fld('Round to',`<select class="inp sel" name="round">${opt([['1','Nearest 1'],['5','Nearest 5']])}</select>`)}<p class="tiny">Safaricom price is not changed.</p>`,
  [{label:'Cancel'},{label:'Apply',cls:'g',onClick:m=>{const v=vals(m),pct=+v.pct,r=+v.round;let n=0;S.plans.forEach(p=>{if(v.cat==='All'||p.category===v.cat){p.price=Math.max(1,Math.round(p.price*(1+pct/100)/r)*r);p.updated=now();n++}});save();render();toast(`Updated ${n} plan(s)`)}}]);
function offersText(){const by={};S.plans.filter(p=>p.enabled).forEach(p=>{(by[p.category]=by[p.category]||[]).push(p)});const pay=S.profile.payMode+' '+(S.profile.pay[S.profile.payMode]||'');
  return `*${S.profile.name} — BINGWA OFFERS*\n`+Object.entries(by).map(([c,l])=>`\n_${c}_\n`+l.map(p=>`• ${p.name} — KES ${p.price}`).join('\n')).join('\n')+`\n\nPay via ${pay}. Offers are sent to the number that pays.`}
A.sharePlans=()=>{const t=offersText();modal('Share plans',`<textarea class="inp" style="min-height:260px" id="shareTxt">${h(t)}</textarea>`,[{label:'Close'},{label:'Copy',cls:'o',onClick:()=>{copy($('#shareTxt').value);return false}},{label:'Share',cls:'g',onClick:()=>{const v=$('#shareTxt').value;if(navigator.share)navigator.share({text:v}).catch(()=>{});else{window.open('https://wa.me/?text='+encodeURIComponent(v),'_blank')}}}])};
</script>
<script>
'use strict';
const planOpts=(sel,all)=>opt(S.plans.filter(p=>all||p.enabled).map(p=>[p.id,planLabel(p)]),sel);
/* ---------- SCHEDULER ---------- */
R.scheduler={title:'USSD Scheduler',acts:()=>`<button class="ib" data-act="schedClear" title="Clear finished"><span class="ms s">delete_sweep</span></button>`,render(){const l=[...S.schedules].sort((a,b)=>a.at-b.at);
  return `<p class="sub" style="margin:6px 4px 12px">Schedule a plan to be dialled for a customer at a set time — once, daily or weekly. Runs while Bingwa is open.</p>
  ${l.map(s=>{const p=planById(s.planId);return `<div class="li"><div class="av"><span class="ms s">schedule_send</span></div><div class="f1"><div class="row sb"><b style="font-weight:500">${h(planLabel(p))}</b>${stPill(s.status)}</div><div class="sub">To ${h(s.phone)} • ${h(s.sim)} • ${s.repeat==='none'?'Once':s.repeat}</div><div class="tiny">${s.status==='scheduled'?'Next: ':'At: '}${fmtDate(s.at)}${s.lastResult?' • last: '+s.lastResult:''}${s.runs?' • runs: '+s.runs:''}</div></div>
  <button class="ib sm" data-act="schedRun" data-id="${s.id}" title="Run now"><span class="ms s">play_arrow</span></button><button class="ib sm" data-act="schedDel" data-id="${s.id}"><span class="ms s">delete</span></button></div>`}).join('')||empty('event_upcoming','Nothing scheduled','Tap New schedule to plan a USSD execution.')}
  <button class="btn g fab" data-act="schedNew"><span class="ms s">add</span>New schedule</button>`}};
A.schedNew=()=>{const d=new Date(now()+5*60e3-new Date().getTimezoneOffset()*60e3).toISOString().slice(0,16);
  modal('New schedule',`${fld('Plan',`<select class="inp sel" name="planId">${planOpts()}</select>`)}${fld('Customer number',inp('phone','','07...','tel'))}${fld('Date & time',inp('at',d,'','datetime-local'))}${fld('Repeat',`<select class="inp sel" name="repeat">${opt([['none','Once'],['daily','Daily'],['weekly','Weekly']])}</select>`)}${fld('SIM',`<select class="inp sel" name="sim">${opt(['SIM 1','SIM 2'])}</select>`)}`,
  [{label:'Cancel'},{label:'Schedule',cls:'g',onClick:m=>{const v=vals(m);if(!/^0\d{9}$/.test(normPhone(v.phone))){toast('Enter a valid number e.g. 0712345678');return false}const at=new Date(v.at).getTime();if(!at){toast('Pick a time');return false}
    S.schedules.push({id:uid(),planId:v.planId,phone:normPhone(v.phone),at,repeat:v.repeat,sim:v.sim,status:'scheduled',runs:0});save();render();toast('Scheduled')}}])};
A.schedDel=d=>{S.schedules=S.schedules.filter(s=>s.id!==d.id);save();render()};
A.schedRun=d=>{const s=S.schedules.find(x=>x.id===d.id);s.at=now();if(s.status!=='running')s.status='scheduled';tick()};
A.schedClear=()=>{S.schedules=S.schedules.filter(s=>s.status==='scheduled'||s.status==='running');save();render()};

/* ---------- CLIENTS ---------- */
function clientFilter(c,f,st){const m=S.settings.metrics;switch(f){case 'Active':return st.active;case 'Dormant':return st.dormant;case 'Blacklisted':return c.blacklisted;case 'New today':return st.isNew;case 'Churned':return st.churned;case 'At risk':return st.risk;default:return true}}
R.clients={title:'Clients',acts:()=>`<button class="ib" data-act="clientsMenu"><span class="ms s">more_vert</span></button><button class="ib" data-act="clientsBulk" title="Message filtered clients"><span class="ms s">select_all</span></button><button class="ib" data-act="clientEdit"><span class="ms s">person_add</span></button>`,render(){
  const m=S.settings.metrics,f=S.ui.cf||'All';let nw=0,ch=0,rk=0,rt=0;S.clients.forEach(c=>{const s=clientState(c);if(s.isNew)nw++;if(s.churned)ch++;if(s.risk)rk++;if(s.returning)rt++});
  const F=[['All','All'],['Active','Active'],['Dormant','Dormant'],['Blacklisted','Blacklisted'],['New today','New today'],['Churned',`Churned ${m.churnDays}d+`],['At risk',`At risk ${m.riskDays}d`]];
  return `<div class="search"><span class="ms s">search</span><input data-in="q" data-k="cl" placeholder="Search by name or number" value="${h((S.ui.q||{}).cl||'')}"></div>
  <div class="chips">${F.map(([k,l])=>`<span class="chip ${f===k?'on':''}" data-act="chip" data-k="cf" data-v="${k}">${l}</span>`).join('')}</div>
  <div class="grid4" style="grid-template-columns:repeat(5,1fr);padding:4px 4px 14px">${[['New today',nw],[`Churned ${m.churnDays}d+`,ch],[`At risk ${m.riskDays}d`,rk],['Returning',rt],['Total',S.clients.length]].map(([l,v])=>`<div><div class="tiny">${l}</div><div class="num mt">${v}</div></div>`).join('')}</div><div id="list">${this.list()}</div>`},
  list(){const f=S.ui.cf||'All',s=q('cl'),lim=S.ui.limit||50;const l=[];for(const c of S.clients){const st=clientState(c);if(clientFilter(c,f,st)&&(!s||(c.name+' '+c.number).toLowerCase().includes(s)))l.push([c,st])}
    l.sort((a,b)=>b[0].lastActive-a[0].lastActive);
    return (l.slice(0,lim).map(([c,st])=>`<div class="li"><div class="av">${/^\d/.test(c.name)?'0':h(initials(c.name))}</div><div class="f1"><div class="row sb"><span style="font-weight:500" class="f1">${h(c.name)}</span><span class="row gap6">${st.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span></div>
    <div class="sub">${h(c.number)} • ${h(c.network)}</div><div class="sub">Spent: KES ${c.spent} • Points: ${c.points}</div><div class="sub">Last active: ${Math.floor(st.d)}d ago • Purchases: ${c.purchases}</div></div><button class="ib sm" data-act="clientMenu" data-id="${c.id}"><span class="ms s">more_vert</span></button></div>`).join('')||empty('groups','No clients','Clients are added automatically when they pay.'))
    +(l.length>lim?`<button class="btn blk" data-act="moreClients">Load more (${l.length-lim} remaining)</button>`:'')}};
A.moreClients=()=>{S.ui.limit=(S.ui.limit||50)+100;$('#list').innerHTML=R.clients.list()};
A.clientMenu=(d,el)=>{const c=S.clients.find(x=>x.id===d.id);popMenu(el,[{label:'View history',icon:'history',fn:()=>{const tx=S.transactions.filter(t=>normPhone(t.phone)===normPhone(c.number));modal(h(c.name),`<div class="sub mb8">${h(c.number)} • First seen ${fmtDate(c.firstSeen)}</div>${tx.map(txRow).join('')||'<div class="sub">No transactions recorded on this device.</div>'}`)}},
  {label:'Recommend package',icon:'send',fn:()=>{S.ui.cNum=c.number;go('console')}},{label:'Send SMS',icon:'sms',fn:()=>composeSms([c.number])},{label:'Edit',icon:'edit',fn:()=>A.clientEdit({id:c.id})},
  {label:c.blacklisted?'Remove from blacklist':'Blacklist',icon:'block',fn:()=>{c.blacklisted=!c.blacklisted;save();render();toast(c.blacklisted?'Blacklisted':'Removed from blacklist')}},
  {label:'Save to contacts',icon:'contact_page',fn:()=>{if(!S.contacts.some(x=>normPhone(x.number)===normPhone(c.number)))S.contacts.push({id:uid(),name:c.name,number:c.number,email:'',source:'local'});save();toast('Saved to contacts')}},
  {label:'Delete',icon:'delete',danger:true,fn:()=>confirmBox('Delete client '+h(c.name)+'?',()=>{S.clients=S.clients.filter(x=>x!==c);save();render()},'Delete')}])};
A.clientEdit=d=>{const c=d&&d.id?S.clients.find(x=>x.id===d.id):{name:'',number:'',network:'Safaricom',points:0};
  modal(d&&d.id?'Edit client':'Add client',`${fld('Name',inp('name',c.name))}${fld('Number',inp('number',c.number,'07...','tel'))}${fld('Network',`<select class="inp sel" name="network">${opt(['Safaricom','Airtel','Telkom','-'],c.network)}</select>`)}${fld('Points',inp('points',c.points,'0','number'))}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(!v.number.trim()){toast('Number required');return false}
    if(d&&d.id)Object.assign(c,{name:v.name||v.number,number:normPhone(v.number),network:v.network,points:+v.points||0});
    else{if(clientByNumber(v.number)){toast('Client already exists');return false}S.clients.unshift({id:uid(),name:v.name||normPhone(v.number),number:normPhone(v.number),network:v.network,spent:0,points:+v.points||0,lastActive:now(),firstSeen:now(),purchases:0,blacklisted:false})}save();render()}}])};
A.clientsMenu=(d,el)=>popMenu(el,[{label:'Export CSV',icon:'download',fn:()=>download('clients.csv',csv([['Name','Number','Network','Spent','Points','Purchases','LastActive','Blacklisted'],...S.clients.map(c=>[c.name,c.number,c.network,c.spent,c.points,c.purchases,fmtIso(c.lastActive),c.blacklisted])]),'text/csv')},
  {label:'Import CSV',icon:'upload',fn:()=>pickFile('.csv,text/csv',t=>{let n=0;parseCsv(t).forEach((r,i)=>{if(i===0&&/name/i.test(r[0]))return;if(r[1]&&!clientByNumber(r[1])){S.clients.unshift({id:uid(),name:r[0]||r[1],number:normPhone(r[1]),network:r[2]||'-',spent:+r[3]||0,points:+r[4]||0,purchases:+r[5]||0,lastActive:now(),firstSeen:now(),blacklisted:false});n++}});save();render();toast(`Imported ${n} client(s)`)})},
  {label:'Metrics settings',icon:'tune',fn:()=>A.metrics()}]);
A.clientsBulk=()=>{const f=S.ui.cf||'All',s=q('cl');const nums=S.clients.filter(c=>clientFilter(c,f,clientState(c))&&!c.blacklisted&&(!s||(c.name+' '+c.number).toLowerCase().includes(s))).map(c=>c.number).filter(n=>/^0\d{9}$/.test(n));composeSms(nums,`${f} clients`)};

/* ---------- CONTACTS ---------- */
R.contacts={title:'Contacts',acts:()=>`<button class="ib" data-act="contactImport" title="Import"><span class="ms s">upload_file</span></button><button class="ib" data-act="contactExport" title="Export"><span class="ms s">download</span></button><button class="ib" data-act="contactsMenu"><span class="ms s">more_vert</span></button>`,render(){const t=S.ui.ctab||'local';
  return `<div class="chips"><span class="chip ${t==='local'?'on':''}" data-act="chip" data-k="ctab" data-v="local">Local</span><span class="chip ${t==='eddypay'?'on':''}" data-act="chip" data-k="ctab" data-v="eddypay">Eddy Pay</span></div>
  ${t==='eddypay'&&!S.smsApi.token?`<div class="card p"><b>Eddy Pay not connected</b><div class="sub mt">Add your Eddy Pay API token in Profile → SMS API to load cloud contacts and groups.</div><button class="btn g sm mt" data-act="smsApi">Add API token</button></div>`:
  `<div class="search"><span class="ms s">search</span><input data-in="q" data-k="ct" placeholder="Search by name, number, email..." value="${h((S.ui.q||{}).ct||'')}"></div><div id="list">${this.list()}</div>`}
  <button class="btn g fab" data-act="contactEdit"><span class="ms s">person_add</span>Add</button>`},
  list(){const t=S.ui.ctab||'local',s=q('ct');const l=S.contacts.filter(c=>c.source===t&&(!s||`${c.name} ${c.number} ${c.email}`.toLowerCase().includes(s)));
    return l.map(c=>`<div class="li"><div class="av">${h(initials(c.name))}</div><div class="f1"><div style="font-weight:500">${h(c.name)}</div><div class="sub">${h(c.number)||'—'}${c.email?' • '+h(c.email):''}</div></div>${c.number?`<button class="ib sm" data-act="contactSms" data-id="${c.id}"><span class="ms s">sms</span></button>`:''}<button class="ib sm" data-act="contactMenu" data-id="${c.id}"><span class="ms s">more_vert</span></button></div>`).join('')||empty('contact_page','No contacts','Add or import contacts.')}};
A.contactSms=d=>{const c=S.contacts.find(x=>x.id===d.id);composeSms([normPhone(c.number)])};
A.contactMenu=(d,el)=>{const c=S.contacts.find(x=>x.id===d.id);popMenu(el,[{label:'Edit',icon:'edit',fn:()=>A.contactEdit({id:c.id})},...(c.number?[{label:'Call',icon:'call',fn:()=>location.href='tel:'+c.number},{label:'Recommend package',icon:'send',fn:()=>{S.ui.cNum=normPhone(c.number);go('console')}}]:[]),{label:'Delete',icon:'delete',danger:true,fn:()=>{S.contacts=S.contacts.filter(x=>x!==c);save();render()}}])};
A.contactEdit=d=>{const c=d&&d.id?S.contacts.find(x=>x.id===d.id):{name:'',number:'',email:''};modal(d&&d.id?'Edit contact':'New contact',`${fld('Name',inp('name',c.name))}${fld('Number',inp('number',c.number,'07...','tel'))}${fld('Email',inp('email',c.email,'','email'))}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(!v.name.trim()){toast('Name required');return false}if(d&&d.id)Object.assign(c,v);else S.contacts.push({id:uid(),...v,source:S.ui.ctab||'local'});save();render()}}])};
A.contactExport=()=>download('contacts.csv',csv([['Name','Number','Email','Source'],...S.contacts.map(c=>[c.name,c.number,c.email,c.source])]),'text/csv');
A.contactImport=()=>pickFile('.csv,.vcf,text/csv,text/vcard',(t,f)=>{let n=0;if(/\.vcf$/i.test(f.name)){t.split('END:VCARD').forEach(b=>{const fn=(b.match(/FN[^:]*:(.+)/)||[])[1],tel=(b.match(/TEL[^:]*:(.+)/)||[])[1];if(fn){S.contacts.push({id:uid(),name:fn.trim(),number:(tel||'').trim(),email:'',source:'local'});n++}})}
  else parseCsv(t).forEach((r,i)=>{if(i===0&&/name/i.test(r[0]))return;if(r[0]){S.contacts.push({id:uid(),name:r[0],number:r[1]||'',email:r[2]||'',source:'local'});n++}});save();render();toast(`Imported ${n} contact(s)`)});
A.contactsMenu=(d,el)=>popMenu(el,[{label:'Sync from clients',icon:'sync',fn:()=>{let n=0;S.clients.forEach(c=>{if(/^0\d{9}$/.test(c.number)&&!S.contacts.some(x=>normPhone(x.number)===c.number)){S.contacts.push({id:uid(),name:c.name,number:c.number,email:'',source:'local'});n++}});save();render();toast(`Added ${n} contact(s)`)}},{label:'Delete all local',icon:'delete',danger:true,fn:()=>confirmBox('Delete all local contacts?',()=>{S.contacts=S.contacts.filter(c=>c.source!=='local');save();render()},'Delete')}]);

/* ---------- USSD CONSOLE ---------- */
R.console={title:'USSD Console',acts:()=>`<button class="ib" data-act="render"><span class="ms s">refresh</span></button><button class="ib" data-act="histClear"><span class="ms s">delete_sweep</span></button>`,render(){const f=S.ui.hf||'All';const sel=S.ui.cPlan||(S.plans.find(p=>p.name==='350 flex')||S.plans[0]||{}).id;
  return `<div class="card p"><div style="font-size:15px;margin-bottom:14px">Recommend a package</div>
  ${fld('Package',`<select class="inp sel" id="cPlan">${planOpts(sel,true)}</select>`)}${fld('USSD mode',`<select class="inp sel" id="cMode">${opt(['Simple','Advanced'],S.ui.cMode||'Simple')}</select>`)}${fld('Execution SIM',`<select class="inp sel" id="cSim">${opt([['SIM 1','sim1'],['SIM 2','sim2']],S.ui.cSim||'SIM 1')}</select>`)}
  <div class="fld"><input class="inp" id="cNum" type="tel" placeholder="Customer number (07/01...)" value="${h(S.ui.cNum||'')}"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn g" data-act="recommend" id="recBtn"><span class="ms s">send</span>Send recommendation</button></div></div>
  <div style="font-size:15px;margin:16px 4px 10px">Execution history</div><div class="chips">${['All','Success','Failed'].map(x=>`<span class="chip ${f===x?'on':''}" data-act="chip" data-k="hf" data-v="${x}">${f===x?'<span class="ms xs">check</span>':''}${x}</span>`).join('')}</div>
  ${S.ussdHistory.filter(x=>f==='All'||(f==='Success'?x.ok:!x.ok)).slice(0,100).map(x=>`<div class="card p"><div class="row sb"><div class="f1"><div style="font-weight:500">${h(x.plan)} @ KES ${x.price}</div><div class="sub">To: ${h(x.to)}</div><div class="sub">Mode: ${h(x.mode)}${x.source&&x.source!=='console'?' • '+h(x.source):''}</div><div class="sub">USSD: <span class="mono">${h(x.ussd)}</span></div></div><button class="ib sm" data-act="histDel" data-id="${x.id}"><span class="ms s">delete</span></button><span class="ms fill ${x.ok?'c-green':'c-red'}">${x.ok?'check_circle':'cancel'}</span></div>
  <div class="pre">Response: ${h(x.response)}</div><div class="tiny mt">Duration: ${x.duration}s &nbsp; Executed: ${fmtDate(x.ts)}</div></div>`).join('')||empty('terminal','No executions','Recommendations you send appear here.')}`}};
A.render=()=>{render();toast('Refreshed')};
A.recommend=async()=>{const p=planById($('#cPlan').value),num=normPhone($('#cNum').value),mode=$('#cMode').value,sim=$('#cSim').value;S.ui.cPlan=p&&p.id;S.ui.cMode=mode;S.ui.cSim=sim;S.ui.cNum=$('#cNum').value;
  if(!p){toast('Pick a package');return}if(!/^0[17]\d{8}$/.test(num)){toast('Enter a valid customer number (07/01...)');return}
  const b=$('#recBtn');b.disabled=true;b.innerHTML='<span class="ms s spin">progress_activity</span>Dialling…';
  const r=await dialUssd(p,num,mode,'console',sim);if(r.kind==='success'){S.balances.airtime=+(S.balances.airtime-p.saf).toFixed(2);upsertClient(num,'',0).purchases++;save()}
  toast(r.kind==='success'?'Recommendation sent':'USSD: '+r.kind);render()};
A.histDel=d=>{S.ussdHistory=S.ussdHistory.filter(x=>x.id!==d.id);save();render()};
A.histClear=()=>confirmBox('Clear all execution history?',()=>{S.ussdHistory=[];save();render()},'Clear');

/* ---------- SMS RELAY ---------- */
R.relay={title:'SMS Relay',render(){const r=S.relay;
  return `<div class="card p"><div class="row sb"><div><b style="font-weight:500">Relay incoming M-PESA SMS</b><div class="sub">Forward verified sender messages to another phone or a webhook.</div></div>${sw('',r.enabled,'data-ch="relayToggle"')}</div></div>
  <div class="card p">${fld('Forward via',`<select class="inp sel" id="rCh">${opt(['SMS','Webhook'],r.channel)}</select>`)}${fld(r.channel==='Webhook'?'Webhook URL':'Forward to number',`<input class="inp" id="rTo" value="${h(r.target)}" placeholder="${r.channel==='Webhook'?'https://example.com/hook':'07...'}">`)}
  <div class="row sb mb8"><span>Only verified senders (${h(S.settings.verifiedSenders.join(', '))})</span>${sw('',r.onlyVerified,'id="rOv"')}</div><button class="btn g blk" data-act="relaySave">Save relay settings</button></div>
  <div style="font-size:15px;margin:16px 4px 10px">Relay log</div>${S.relayLog.slice(0,50).map(l=>`<div class="li"><span class="ms s">forward_to_inbox</span><div class="f1"><div class="sub">${h(l.from)} → ${h(l.to)} • ${rel(l.ts)}</div><div class="pre">${h(l.body)}</div></div></div>`).join('')||'<div class="sub" style="padding:0 4px">Nothing relayed yet.</div>'}`}};
A.relayToggle=(d,el)=>{if(el.checked&&!S.relay.target){toast('Set a forward target first');el.checked=false;return}S.relay.enabled=el.checked;save();toast(el.checked?'Relay on':'Relay off')};
A.relaySave=()=>{S.relay.channel=$('#rCh').value;S.relay.target=$('#rTo').value.trim();S.relay.onlyVerified=$('#rOv').checked;save();render();toast('Saved')};
document.addEventListener('change',e=>{if(e.target.id==='rCh'){S.relay.channel=e.target.value;save();render()}});

/* ---------- BULK SMS & OUTBOX ---------- */
function composeSms(nums,label){nums=[...new Set(nums.filter(Boolean))];modal('Send SMS',`<div class="sub mb8">${label?h(label)+' — ':''}${nums.length} recipient(s)</div>${nums.length<=5?fld('To',inp('to',nums.join(', '))):`<input type="hidden" name="to" value="${h(nums.join(','))}">`}${fld('Message',`<textarea class="inp" name="body" placeholder="Type message… placeholders: {Business} {Payment} {OffersList}"></textarea>`)}${fld('Send via',`<select class="inp sel" name="ch">${opt(['SIM 1','SIM 2',...(S.autoReply.senderId?['SMSHub:'+S.autoReply.senderId]:[])])}</select>`)}`,
  [{label:'Cancel'},{label:'Send',cls:'g',onClick:m=>{const v=vals(m);const to=v.to.split(/[,\s]+/).map(normPhone).filter(Boolean);if(!to.length||!v.body.trim()){toast('Recipients and message required');return false}
    to.forEach(n=>sendSms(n,fillTpl(v.body,{phone:n}),v.ch,{kind:'bulk'}));S.bulkHistory.unshift({id:uid(),ts:now(),count:to.length,body:v.body,ch:v.ch});save();softRender();toast(`Sending ${to.length} SMS`)}}])}
R.bulk={title:'Bulk SMS',acts:()=>`<button class="ib" data-act="go" data-r="outbox" title="Outbox"><span class="ms s">outbox</span></button>`,render(){
  return `<div class="card p"><div class="lbl mb8">Compose</div>${fld('Audience',`<select class="inp sel" id="bAud">${opt([['all','All clients'],['active','Active clients'],['risk','At-risk clients'],['churned','Churned clients'],['contacts','Local contacts'],['manual','Enter numbers manually']],S.ui.bAud||'active')}</select>`)}
  <div id="bManual" class="${(S.ui.bAud||'active')==='manual'?'':'hidden'}">${fld('Numbers (comma or new line)',`<textarea class="inp" id="bNums" style="min-height:60px"></textarea>`)}</div>
  ${fld('Message',`<textarea class="inp" id="bBody">${h(S.ui.bBody||'Hi! Get today\'s best Bingwa deals:\n{OffersList}\nPay via {Payment}.')}</textarea>`)}<div class="tiny mb8">Placeholders: {Business} {Payment} {OffersList} {Customer}</div>
  <div class="row"><button class="btn o f1" data-act="bulkTpl">Insert offers list</button><button class="btn g f1" data-act="bulkSend"><span class="ms s">send</span>Send</button></div></div>
  <div style="font-size:15px;margin:16px 4px 10px">Campaigns</div>${S.bulkHistory.slice(0,30).map(b=>`<div class="li"><span class="ms s">campaign</span><div class="f1"><div class="sub">${b.count} recipients • ${h(b.ch)} • ${rel(b.ts)}</div><div class="pre">${h(b.body)}</div></div></div>`).join('')||'<div class="sub" style="padding:0 4px">No campaigns yet.</div>'}`}};
document.addEventListener('change',e=>{if(e.target.id==='bAud'){S.ui.bAud=e.target.value;$('#bManual').classList.toggle('hidden',e.target.value!=='manual')}});
A.bulkTpl=()=>{const b=$('#bBody');b.value+=(b.value?'\n':'')+'{OffersList}'};
A.bulkSend=()=>{const a=$('#bAud').value;S.ui.bBody=$('#bBody').value;let nums=[];
  if(a==='manual')nums=$('#bNums').value.split(/[,\s]+/).map(normPhone);else if(a==='contacts')nums=S.contacts.filter(c=>c.source==='local').map(c=>normPhone(c.number));
  else nums=S.clients.filter(c=>{const s=clientState(c);return !c.blacklisted&&(a==='all'||(a==='active'&&s.active)||(a==='risk'&&s.risk)||(a==='churned'&&s.churned))}).map(c=>c.number);
  nums=nums.filter(n=>/^0[17]\d{8}$/.test(n));if(!nums.length){toast('No valid recipients in this audience');return}
  confirmBox(`Send this message to <b>${nums.length}</b> recipient(s)?`,()=>{nums.forEach(n=>sendSms(n,fillTpl(S.ui.bBody,{phone:n}),null,{kind:'bulk'}));S.bulkHistory.unshift({id:uid(),ts:now(),count:nums.length,body:S.ui.bBody,ch:S.autoReply.senderId?'SMSHub':S.settings.notifSim});save();render();toast(`Queued ${nums.length} SMS`)},'Send','g')};
R.outbox={title:'SMS Outbox',back:true,acts:()=>`<button class="ib" data-act="outClear"><span class="ms s">delete_sweep</span></button>`,render(){return S.outbox.slice(0,200).map(o=>`<div class="li"><span class="ms s ${o.status==='sent'?'c-green':o.status==='failed'?'c-red':'c-yel'}">${o.status==='sent'?'done_all':o.status==='failed'?'error':'schedule'}</span><div class="f1"><div class="row sb"><span class="sub">To ${h(o.to)} • ${h(o.channel)}${o.kind?' • '+h(o.kind):''}</span><span class="tiny">${rel(o.ts)}</span></div><div class="pre">${h(o.body)}</div></div></div>`).join('')||empty('outbox','Outbox empty','Auto replies, notifications and bulk SMS appear here.')}};
A.outClear=()=>{S.outbox=[];save();render()};

/* ---------- M-PESA MESSAGES ---------- */
R.mpesa={title:'MPESA Messages',acts:()=>`<button class="ib" data-act="mpesaScan" title="Process all unprocessed payments"><span class="ms s">checklist</span></button><button class="ib" data-act="mpesaRefresh"><span class="ms s">refresh</span></button>`,render(){
  return `<div class="search"><span class="ms s">search</span><input data-in="q" data-k="mp" placeholder="Search messages..." value="${h((S.ui.q||{}).mp||'')}"></div>
  <div class="row sb" style="padding:4px"><button class="btn o sm" data-act="simPay"><span class="ms s">science</span>Simulate payment</button><button class="ib sm" data-act="mpesaPaste" title="Paste an SMS"><span class="ms s">sort</span></button></div><div id="list">${this.list()}</div>`},
  list(){const s=q('mp');const l=S.mpesa.filter(m=>!s||m.body.toLowerCase().includes(s));
    return `<div class="tiny" style="margin:8px 4px 12px">Showing ${Math.min(100,l.length)} messages${l.length>100?' (scroll for more)':''}</div>`+l.slice(0,100).map(m=>{const p=parseMpesa(m.body),done=p&&S.transactions.some(t=>t.code===p.code);
    return `<div class="card p"><div class="row sb"><span class="row gap6"><span class="ms s">account_circle</span><b style="font-weight:500">${h(m.sender)}</b>${p?`<span class="tag">${done?'processed':'payment'}</span>`:''}</span><span class="tiny">${rel(m.ts)}</span></div><div style="margin:10px 0 12px;line-height:1.45">${h(m.body)}</div>
    <div class="row"><button class="btn o f1 sm" data-act="mpesaRerun" data-id="${m.id}"><span class="ms s">replay</span>Rerun</button><button class="btn o f1 sm" data-act="mpesaCopy" data-id="${m.id}"><span class="ms s">content_copy</span>Copy</button></div></div>`}).join('')}};
A.mpesaCopy=d=>copy(S.mpesa.find(m=>m.id===d.id).body);
A.mpesaRerun=d=>{const m=S.mpesa.find(x=>x.id===d.id),p=parseMpesa(m.body);if(!p){toast('Not a payment message — nothing to rerun');return}
  const ex=S.transactions.find(t=>t.code===p.code);if(ex&&ex.status==='completed'){confirmBox(`${p.code} was already completed. Rerun anyway?`,()=>{processPayment(p,{force:true});render()},'Rerun','g');return}
  if(ex){ex.status='pending';ex.notes.push('Rerun from M-PESA messages');if(S.automation)runTx(ex);else toast('Queued — start automation');save()}else processPayment(p);render()};
A.mpesaScan=()=>{let n=0;S.mpesa.forEach(m=>{const p=parseMpesa(m.body);if(p&&!S.transactions.some(t=>t.code===p.code)){processPayment(p);n++}});toast(n?`Processing ${n} missed payment(s)`:'No missed payments found');render()};
A.mpesaRefresh=()=>{render();toast('Inbox refreshed')};
A.mpesaPaste=()=>modal('Add SMS to inbox',`<p class="sub mb8">Paste a received SMS (e.g. a real M-PESA confirmation) to process it.</p>${fld('Sender',inp('sender','MPESA'))}${fld('Message',`<textarea class="inp" name="body"></textarea>`)}`,[{label:'Cancel'},{label:'Receive',cls:'g',onClick:m=>{const v=vals(m);if(!v.body.trim())return false;receiveSms(v.sender.trim()||'MPESA',v.body.trim())}}]);

/* ---------- UNVERIFIED ---------- */
R.unverified={title:'Unverified Transactions',render(){return `<p class="sub" style="margin:6px 4px 12px">Payment-looking SMS from senders not in your Verified Senders list. Review before processing to avoid fake M-PESA messages.</p>`+
  (S.unverified.map(u=>{const p=parseMpesa(u.body);return `<div class="card p"><div class="row sb"><b style="font-weight:500">${h(u.sender)}</b><span class="tiny">${rel(u.ts)}</span></div><div class="tag mt" style="display:inline-block">${h(u.reason)}</div><div style="margin:10px 0">${h(u.body)}</div>${p?`<div class="sub mb8">Parsed: ${h(p.code)} • ${kes(p.amount)} • ${h(p.name)} ${h(p.phone)}</div>`:''}
  <div class="row"><button class="btn o f1 sm" data-act="unvDismiss" data-id="${u.id}"><span class="ms s">close</span>Dismiss</button><button class="btn g f1 sm" data-act="unvApprove" data-id="${u.id}" ${p?'':'disabled'}><span class="ms s">verified</span>Verify &amp; process</button></div></div>`}).join('')||empty('verified_user','All clear','No unverified transactions.'))}};
A.unvDismiss=d=>{S.unverified=S.unverified.filter(u=>u.id!==d.id);save();render()};
A.unvApprove=d=>{const u=S.unverified.find(x=>x.id===d.id);const p=parseMpesa(u.body);confirmBox('Only approve if you confirmed this payment in your M-PESA statement. Process now?',()=>{S.unverified=S.unverified.filter(x=>x!==u);processPayment(p);save();render()},'Process','g')};
</script>
<script>
'use strict';
/* ---------- PORTAL ---------- */
const PORTAL='https://portal.bingwastore.com';
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:5,margin:0})}catch(e){return `<img alt="QR" width="150" height="150" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=0&data=${encodeURIComponent(t)}">`}}
R.portal={title:'Portal',acts:()=>`<button class="ib" data-act="portalShare"><span class="ms s">share</span></button>`,render(){const p=S.portal;
  return `<div class="card p"><div class="row"><div class="av"><span class="ms s">${p.paired?'cloud_done':'cloud_off'}</span></div><div class="f1"><b style="font-weight:500">${p.paired?'Paired':'Not paired'}</b><div class="tiny">${p.paired?`${h(p.deviceName)} • online since ${rel(p.pairedAt)}`:'Enter a pairing code from portal.bingwastore.com'}</div></div>${p.paired?'<button class="btn sm" data-act="unpair">Unpair</button>':''}</div></div>
  <div class="card p"><b style="font-weight:500">Website</b><div class="tiny">Open this link on a computer or another phone to manage this device from the web.</div>
   <div style="display:flex;justify-content:center;margin:16px 0 8px"><div style="background:#fff;border-radius:12px;padding:10px">${qrSvg(PORTAL)}</div></div>
   <div style="text-align:center;font-size:12.5px;margin-bottom:12px">${PORTAL}</div>
   <div class="row" style="justify-content:center"><a class="btn g sm" href="${PORTAL}" target="_blank"><span class="ms s">open_in_new</span>Open</a><button class="btn g sm" data-act="portalShare"><span class="ms s">share</span>Share</button><button class="btn o sm" data-act="portalCopy"><span class="ms s">content_copy</span>Copy</button></div></div>
  ${p.paired?'':`<div class="card p"><b style="font-weight:500">Pair this phone</b><div class="tiny mb8">On portal.bingwastore.com, open Add device and enter the code shown there.</div>
   ${fld('Device name',`<input class="inp" id="pName" value="${h(p.deviceName)}">`)}<div class="fld"><input class="inp mono" id="pCode" maxlength="6" placeholder="Pairing code" style="text-transform:uppercase"></div><button class="btn g blk" data-act="pair"><span class="ms s">link</span>Pair and connect</button></div>`}
  <div class="card p"><b style="font-weight:500">How to use it</b><ol class="steps"><li><i>1</i><div>Open the portal link<div class="tiny">Use Open, Share, or scan the QR code on a browser.</div></div></li><li><i>2</i><div>Sign in<div class="tiny">Use the phone number used to register your account.</div></div></li><li><i>3</i><div>Add this device<div class="tiny">On the website tap Add device, then type the 6-character code here.</div></div></li><li><i>4</i><div>Stay online<div class="tiny">Keep Bingwa open or in the background so the website can send commands.</div></div></li></ol></div>
  <p class="tiny" style="padding:0 4px">Keep Bingwa running so this phone stays online. The connection uses the same background service as automation, and stays up after you leave this page or swipe the app away.</p>`}};
A.portalCopy=()=>copy(PORTAL);A.portalShare=()=>navigator.share?navigator.share({url:PORTAL,title:'Bingwa Portal'}).catch(()=>{}):copy(PORTAL);
A.pair=async()=>{const c=$('#pCode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c)){toast('Enter the 6-character code from the portal');return}toast('Pairing…');await sleep(900);S.portal={paired:true,deviceName:$('#pName').value.trim()||'Android phone',pairedAt:now()};save();render();toast('Paired with portal')};
A.unpair=()=>confirmBox('Unpair this device from the portal?',()=>{S.portal.paired=false;save();render()},'Unpair');

/* ---------- NOTIFICATIONS ---------- */
const TRIG=[['completed','Transaction completed'],['failed','Transaction failed'],['low_balance','Low airtime balance (< KES 500)']];
R.notifications={title:'Notification Templates',acts:()=>`<button class="ib" data-act="notifSim" title="Notification SIM"><span class="ms s">sim_card</span></button>`,render(){
  return (S.templates.length?S.templates.map(t=>`<div class="card p"><div class="row sb"><b style="font-weight:500">${h(t.name)}</b><span class="row">${sw('',t.on,`data-ch="tplToggle" data-id="${t.id}"`)}<button class="ib sm" data-act="tplMenu" data-id="${t.id}"><span class="ms s">more_vert</span></button></span></div><div class="sub">${h((TRIG.find(x=>x[0]===t.trigger)||[])[1])} • ${h(t.sim)} • to ${h(t.to||'my number')}</div><div class="pre">${h(t.body)}</div></div>`).join(''):`<div class="empty" style="padding-top:60px">No templates yet. Tap + to create one.</div>`)
  +`<button class="btn g fab" data-act="tplEdit"><span class="ms s">add</span>New Template</button>`}};
A.notifSim=()=>modal('Default notification SIM',fld('SIM',`<select class="inp sel" name="sim">${opt(['SIM 1','SIM 2'],S.settings.notifSim)}</select>`),[{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{S.settings.notifSim=vals(m).sim;save();toast('Saved')}}]);
A.tplToggle=(d,el)=>{S.templates.find(t=>t.id===d.id).on=el.checked;save()};
A.tplMenu=(d,el)=>popMenu(el,[{label:'Edit',icon:'edit',fn:()=>A.tplEdit({id:d.id})},{label:'Send test',icon:'send',fn:()=>{const t=S.templates.find(x=>x.id===d.id);sendSms(t.to||normPhone(S.profile.phone),fillTpl(t.body,{code:'TEST123',plan:'250mbs',amount:20,phone:'0712345678'}),t.sim,{kind:'test'});toast('Test queued — see Outbox')}},{label:'Delete',icon:'delete',danger:true,fn:()=>{S.templates=S.templates.filter(t=>t.id!==d.id);save();render()}}]);
A.tplEdit=d=>{const t=d&&d.id?S.templates.find(x=>x.id===d.id):{name:'',trigger:'completed',body:'{TransactionId}: {PackageName} sent to {Customer} (KES {Amount}).',sim:S.settings.notifSim,to:'',on:true};
  modal(d&&d.id?'Edit template':'New template',`${fld('Name',inp('name',t.name,'e.g. Owner alert'))}${fld('Trigger',`<select class="inp sel" name="trigger">${opt(TRIG,t.trigger)}</select>`)}${fld('Send to (blank = my profile number)',inp('to',t.to,'07...','tel'))}${fld('Message',`<textarea class="inp" name="body">${h(t.body)}</textarea>`)}<div class="tiny mb8">Placeholders: {TransactionId} {PackageName} {Customer} {Amount} {Business}</div>${fld('SIM',`<select class="inp sel" name="sim">${opt(['SIM 1','SIM 2'],t.sim)}</select>`)}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(!v.name.trim()||!v.body.trim()){toast('Name and message required');return false}if(d&&d.id)Object.assign(t,v);else S.templates.push({id:uid(),...v,on:true});save();render()}}])};

/* ---------- AUTO REPLY ---------- */
const ARM=[['completed','Completed','check_circle','#4ade80'],['failed','Failed','error','#f87171'],['disabled','System / Plan Disabled','pause_circle','#fb923c'],['restricted','Restricted Number','block','#c084fc'],['unavailable','Unavailable Offer','inventory_2','#60a5fa'],['already','Already Recommended (fallback)','alt_route','#facc15'],['offers','OFFERS keyword reply','local_offer','#2dd4bf']];
R.autoreply={title:'Auto Reply',acts:()=>`<button class="ib" data-act="go" data-r="outbox" title="Outbox"><span class="ms s">receipt_long</span></button>`,render(){const a=S.autoReply;
  return `<div class="card p"><b style="font-weight:500">Your system number</b><div class="tiny">The phone number on this device that will be used by the customers to interact with your system.</div>
   <div class="row" style="margin:16px 0"><span class="ms c-blue">smartphone</span><div><b style="font-weight:500">${a.systemNumber?h(a.systemNumber):'Not set up'}</b><div class="tiny">${a.systemNumber?h(a.sim):'Select a SIM to detect your line number'}</div></div></div>
   <button class="btn g blk" data-act="arSim"><span class="ms s">sim_card</span>${a.systemNumber?'Change SIM / number':'Set up from SIM'}</button><div class="tiny mt"><i>Used in reply templates as {SystemNumber} and for device SMS (e.g. when customers text OFFERS) on the selected SIM.</i></div></div>
  <div class="card p"><div class="row"><span class="ms">timer</span><b style="font-weight:500">Send timeout</b></div><div class="tiny mb8">Transactional replies should not sit behind a bad connection. If a message is still not sent when this time runs out, it is treated as failed so the customer is not left waiting.</div>
   ${fld('Fail if not sent within',`<select class="inp sel" data-ch="arTimeout">${opt([[10,'10 seconds'],[15,'15 seconds'],[30,'30 seconds'],[60,'60 seconds']],a.timeout)}</select>`)}<div class="tiny"><i>System number, timeout, sender ID, and which replies are active are saved on this device.</i></div></div>
  <div class="card p"><div class="row sb"><div class="row"><span class="ms c-blue">forward_to_inbox</span><b style="font-weight:500">Transactional sender (SMSHub)</b></div><button class="ib sm" data-act="arSenders"><span class="ms s">refresh</span></button></div><div class="tiny mb8">Sender ID used when this app sends transactional SMS through SMSHub. Saved on this device. Tap the field to load senders from SMSHub and choose one; use refresh to update the list.</div>
   ${fld('Sender ID',`<select class="inp sel" data-ch="arSender">${opt([['','Not set — tap to choose'],['BINGWA','BINGWA'],['SMSHUB','SMSHUB']],a.senderId)}</select>`)}</div>
  <div style="font-size:14px;margin:16px 4px 10px">Transactional messages</div>
  ${ARM.map(([k,l,ic,col])=>`<div class="card p"><div class="row" style="align-items:flex-start"><div class="av" style="border-radius:10px;background:${col}22"><span class="ms s" style="color:${col}">${ic}</span></div><div class="f1"><b style="font-weight:500">${l}</b><div class="sub" style="margin-top:4px">${h(a.messages[k].text)}</div><a href="#" class="sub c-blue" data-act="arEdit" data-k="${k}" style="display:inline-flex;gap:4px;margin-top:8px"><span class="ms xs">edit</span>Edit message</a></div>${sw('',a.messages[k].on,`data-ch="arToggle" data-k="${k}"`)}</div></div>`).join('')}`}};
A.arSim=()=>modal('Set up from SIM',`<p class="sub mb8">Browsers can't read SIM numbers, so confirm the line number for the selected SIM.</p>${fld('SIM',`<select class="inp sel" name="sim">${opt(['SIM 1','SIM 2'],S.autoReply.sim||'SIM 1')}</select>`)}${fld('Line number',inp('num',S.autoReply.systemNumber||S.settings.ussd.sims['SIM 1']||'','07...','tel'))}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(!/^0[17]\d{8}$/.test(normPhone(v.num))){toast('Enter a valid number');return false}S.autoReply.sim=v.sim;S.autoReply.systemNumber=normPhone(v.num);S.settings.ussd.sims[v.sim]=normPhone(v.num);save();render();toast('System number set')}}]);
A.arTimeout=(d,el)=>{S.autoReply.timeout=+el.value;save()};A.arSender=(d,el)=>{S.autoReply.senderId=el.value;save();toast(el.value?'Sender ID set':'Using device SIM')};
A.arSenders=async()=>{toast('Loading senders from SMSHub…');await sleep(700);toast('Sender list up to date')};
A.arToggle=(d,el)=>{S.autoReply.messages[d.k].on=el.checked;save()};
A.arEdit=d=>{const m=S.autoReply.messages[d.k];modal('Edit message',`${fld((ARM.find(x=>x[0]===d.k)||[])[1],`<textarea class="inp" name="text" style="min-height:130px">${h(m.text)}</textarea>`)}<div class="tiny">Placeholders: {TransactionId} {PackageName} {SystemNumber} {Amount} {Customer} {Payment} {OffersList} {Business}</div><div class="lbl mt">Preview</div><div class="pre" id="arPrev"></div>`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:x=>{m.text=vals(x).text;save();render()}}]);const up=()=>$('#arPrev').textContent=fillTpl($('#modal [name=text]').value,{code:'UJSIY0CTQQ',plan:'250mbs',amount:20,phone:'0712345678'});up();$('#modal [name=text]').oninput=up};

/* ---------- FALLBACK ---------- */
R.fallback={title:'Fallback Plans',acts:()=>`<button class="btn o sm" style="border:0" data-act="fbClear">Clear</button>`,render(){const f=S.fallbacks;
  return `<div style="padding:6px 4px"><b style="font-weight:500">Configure an automatic fallback recommendation.</b><div class="tiny" style="margin-top:4px;line-height:1.5">Map a primary plan to one alternative. Already recommended runs as soon as Safaricom returns that USSD text. Purchase failed waits until this primary plan's auto-retry is exhausted (timeouts keep retrying the same plan). Chained fallbacks show as (FB) in history with a "Fallback from … → …" note.</div></div>
  <div class="row sb" style="margin:12px 4px"><span class="row"><span class="chip ${f.active?'on':''}" data-act="fbActive">${f.active?'<span class="ms xs">check</span>Active':'Inactive'}</span><span class="tiny">${f.active?'Fallback will run when conditions match.':'Fallbacks are paused.'}</span></span><button class="ib sm" data-act="fbHelp"><span class="ms s c-blue">help</span></button></div>
  <div class="card p"><div style="font-size:15px;margin-bottom:12px">Mappings</div>${f.maps.map(m=>{const a=planById(m.from),b=planById(m.to);return `<div class="li" style="background:var(--card2)"><div class="f1"><div>${h(a?a.name:'(deleted)')} → ${h(b?b.name:'(deleted)')}</div><div class="tiny">Trigger: ${m.trigger==='already'?'Already recommended':'Purchase failed'}</div></div><button class="ib sm" data-act="fbDel" data-id="${m.id}"><span class="ms s">delete</span></button></div>`}).join('')||'<div class="sub">No mappings yet.</div>'}</div>
  <button class="btn g fab" data-act="fbAdd"><span class="ms s">add</span>Map</button>`}};
A.fbActive=()=>{S.fallbacks.active=!S.fallbacks.active;save();render()};
A.fbDel=d=>{S.fallbacks.maps=S.fallbacks.maps.filter(m=>m.id!==d.id);save();render()};
A.fbClear=()=>confirmBox('Remove all fallback mappings?',()=>{S.fallbacks.maps=[];save();render()},'Clear');
A.fbHelp=()=>modal('How fallbacks work',`<ol class="steps"><li><i>1</i>Customer pays for a primary plan.</li><li><i>2</i><b>Already recommended</b>: if Safaricom says the number already got that offer, the mapped alternative is dialled immediately.</li><li><i>3</i><b>Purchase failed</b>: after the primary plan's auto-retries are used up, the alternative is dialled.</li><li><i>4</i>Fallback runs appear as <b>(FB)</b> in transactions.</li></ol>`);
A.fbAdd=()=>modal('New fallback mapping',`${fld('Primary plan',`<select class="inp sel" name="from">${planOpts('',true)}</select>`)}${fld('Fallback plan',`<select class="inp sel" name="to">${planOpts('',true)}</select>`)}${fld('Trigger',`<select class="inp sel" name="trigger">${opt([['already','Already recommended'],['failed','Purchase failed']])}</select>`)}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(v.from===v.to){toast('Pick a different fallback plan');return false}if(S.fallbacks.maps.some(x=>x.from===v.from&&x.trigger===v.trigger)){toast('That plan already has a fallback for this trigger');return false}S.fallbacks.maps.push({id:uid(),...v});save();render()}}]);

R.profile={title:'Profile',acts:()=>`<button class="ib" data-act="profEdit"><span class="ms s">edit</span></button>`,render(){const p=S.profile,mode=S.ui.payMode||p.payMode;
  const lab={Paybill:'Paybill number',Till:'Till number','M-Pesa number':'M-Pesa number'}[mode];const preview=`${mode==='M-Pesa number'?'Send money to':mode} ${p.pay[mode]||'…'}${mode==='Paybill'&&p.paybillAcc?' Acc '+p.paybillAcc:''}`;
  const qa=(i,t,s,act,r='')=>`<div class="set" data-act="${act}" ${r?`data-r="${r}"`:''}><span class="ms">${i}</span><div class="t">${t}<small>${s}</small></div><span class="ms s">chevron_right</span></div>`;
  return `<div style="background:var(--card2);margin:-6px -12px 16px;padding:28px 0 22px;text-align:center"><div class="av" style="width:96px;height:96px;margin:0 auto;background:#7cc6f7;color:#08314a;font-size:20px">${h(initials(p.name))}</div><div style="font-weight:700;margin-top:14px;font-size:13px">${h(p.name)}</div><div class="sub" style="margin-top:4px">${h(p.org)}</div></div>
  <b style="font-size:15px">Contact Information</b><div class="sub mb8">Your registered contact details</div>
  <div class="card p"><div class="row mb8"><span class="ms c-blue">call</span><div class="f1"><div class="tiny">Phone Number</div>${h(p.phone)}</div><button class="btn o sm" style="border:0" data-act="profPhone"><span class="ms s">sim_card</span>Change</button></div><div class="row mb8"><span class="ms c-blue">mail</span><div><div class="tiny">Email Address</div>${h(p.email)}</div></div><div class="row"><span class="ms c-blue">corporate_fare</span><div><div class="tiny">Organization</div>${h(p.org)}</div></div></div>
  <b style="font-size:15px">Payment receiving</b><div class="sub mb8">Paybill, till, or M-Pesa number for customer payments</div>
  <div class="card p"><div class="row"><span class="ms">payments</span><b style="font-weight:500">Payment receiving</b></div><div class="tiny mb8">Where customers send M-Pesa for your offers. This is shown in OFFERS SMS — separate from your Auto Reply line.</div>
   <div class="seg mb8">${['Paybill','Till','M-Pesa number'].map(x=>`<button class="${mode===x?'on':''}" data-act="payMode" data-v="${x}">${mode===x?'✓ ':''}${x}</button>`).join('')}</div>
   ${fld(lab,`<input class="inp" id="payNum" value="${h(p.pay[mode]||'')}" inputmode="numeric">`)}${mode==='Paybill'?fld('Account number',`<input class="inp" id="payAcc" value="${h(p.paybillAcc)}">`):''}
   <div class="inp tiny mb8" id="payPrev">Customers will see: "${h(preview)}"</div><button class="btn g blk" data-act="paySave"><span class="ms s">save</span>Save payment settings</button></div>
  <b style="font-size:15px">Security</b><div class="sub mb8">Choose which actions require fingerprint or PIN</div><div class="card">${qa('fingerprint','Device security',p.security.enabled?'On · '+Object.entries(p.security.protect).filter(x=>x[1]).length+' action(s) protected':'Off · choose what to protect','security')}</div>
  <b style="font-size:15px">Quick Actions</b><div class="sub mb8">Account and app management</div><div class="card">${qa('settings','USSD Settings','Configure automation parameters','ussdSettings')}${qa('verified_user','Verified Senders','Manage trusted SMS senders (e.g., M-PESA)','senders')}${qa('hub','SMS API','Eddy Pay API token for cloud contacts (import & groups)','smsApi')}${qa('tune','App Settings','Theme, language and preferences','go','settings')}</div>
  <b style="font-size:15px">Account</b><div class="sub mb8">Backup, support, and updates</div><div class="card">${qa('cloud_upload','Backup','Export selected data securely','backup')}${qa('cloud_download','Restore','Restore from an encrypted backup file','restore')}${qa('help','Help &amp; Support','Tutorials and guides on home.bingwastore.com','helpSite')}${qa('system_update','Update App','Check for and install the latest version','go','updates')}${qa('restart_alt','Reset all data','Erase everything and start fresh','resetAll')}</div>`}};
A.payMode=d=>{S.ui.payMode=d.v;render()};
A.paySave=()=>{const mode=S.ui.payMode||S.profile.payMode,v=$('#payNum').value.trim();if(!/^\d{5,12}$/.test(v)){toast('Enter a valid number');return}S.profile.payMode=mode;S.profile.pay[mode]=v;if($('#payAcc'))S.profile.paybillAcc=$('#payAcc').value.trim();save();render();toast('Payment settings saved')};
document.addEventListener('input',e=>{if(e.target.id==='payNum'||e.target.id==='payAcc'){const mode=S.ui.payMode||S.profile.payMode;const acc=$('#payAcc');$('#payPrev').textContent=`Customers will see: "${mode==='M-Pesa number'?'Send money to':mode} ${$('#payNum').value||'…'}${acc&&acc.value?' Acc '+acc.value:''}"`}});
A.profEdit=()=>{const p=S.profile;modal('Edit profile',`${fld('Business name',inp('name',p.name))}${fld('Organization',inp('org',p.org))}${fld('Email',inp('email',p.email,'','email'))}`,[{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{Object.assign(p,vals(m));save();render()}}])};
A.profPhone=()=>modal('Change phone number',`${fld('SIM',`<select class="inp sel" name="sim">${opt(['SIM 1','SIM 2'])}</select>`)}${fld('Phone number',inp('phone',S.profile.phone,'7XX XXX XXX','tel'))}`,[{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);S.profile.phone=v.phone;S.settings.ussd.sims[v.sim]=normPhone(v.phone);save();render()}}]);
A.security=()=>{const s=S.profile.security;modal('Device security',`<div class="row sb mb8"><b style="font-weight:500">Enable device security</b>${sw('enabled',s.enabled)}</div>${fld('Security PIN (4–6 digits)',inp('pin',s.pin,'••••','password','inputmode="numeric" maxlength="6"'))}<div class="lbl mt mb8">Require PIN for</div>
  ${[['automation','Start / stop automation'],['plans','Edit, enable or delete plans'],['backup','Backup &amp; restore'],['balances','Show hidden balances']].map(([k,l])=>`<div class="row sb mb8"><span>${l}</span>${sw('p_'+k,s.protect[k])}</div>`).join('')}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);if(v.enabled&&!/^\d{4,6}$/.test(v.pin)){toast('PIN must be 4–6 digits');return false}s.enabled=v.enabled;s.pin=v.pin;Object.keys(s.protect).forEach(k=>s.protect[k]=v['p_'+k]);save();render();toast('Security updated')}}])};
A.ussdSettings=()=>{const u=S.settings.ussd;modal('USSD Settings',`${fld('Default execution SIM',`<select class="inp sel" name="defaultSim">${opt(['SIM 1','SIM 2'],u.defaultSim)}</select>`)}${fld('USSD session timeout (seconds)',inp('timeout',u.timeout,'','number'))}${fld('Delay between sessions (seconds)',inp('delay',u.delay,'','number'))}${fld('SIM 1 number',inp('sim1',u.sims['SIM 1'],'07...'))}${fld('SIM 2 number',inp('sim2',u.sims['SIM 2'],'07...'))}${fld('Simulated network success rate (%) — demo only',inp('successRate',u.successRate,'','number','min="0" max="100"'))}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);Object.assign(u,{defaultSim:v.defaultSim,timeout:+v.timeout||30,delay:+v.delay||0,successRate:Math.min(100,Math.max(0,+v.successRate))});u.sims={'SIM 1':v.sim1,'SIM 2':v.sim2};save();toast('USSD settings saved')}}])};
A.senders=()=>{const draw=()=>`${S.settings.verifiedSenders.map((s,i)=>`<div class="li"><span class="ms s c-green">verified_user</span><span class="f1">${h(s)}</span><button class="ib sm" data-act="senderDel" data-i="${i}"><span class="ms s">delete</span></button></div>`).join('')}<div class="row mt"><input class="inp f1" id="newSender" placeholder="Sender name e.g. MPESA"><button class="btn g" data-act="senderAdd">Add</button></div>`;
  modal('Verified Senders',`<p class="sub mb8">Only payments from these senders are processed automatically. Others go to Unverified Transactions.</p><div id="sendersBox">${draw()}</div>`,[{label:'Done',onClick:()=>render()}]);A._drawSenders=()=>$('#sendersBox').innerHTML=draw()};
A.senderAdd=()=>{const v=$('#newSender').value.trim();if(v&&!S.settings.verifiedSenders.includes(v)){S.settings.verifiedSenders.push(v);save()}A._drawSenders()};
A.senderDel=d=>{S.settings.verifiedSenders.splice(+d.i,1);save();A._drawSenders()};
A.smsApi=()=>modal('SMS API (Eddy Pay)',`<p class="sub mb8">Paste your Eddy Pay API token to load cloud contacts and groups.</p>${fld('API token',inp('token',S.smsApi.token,'ep_live_…','password'))}`,[{label:'Cancel'},...(S.smsApi.token?[{label:'Remove',cls:'o',onClick:()=>{S.smsApi.token='';S.contacts=S.contacts.filter(c=>c.source!=='eddypay');save();render()}}]:[]),{label:'Save',cls:'g',onClick:m=>{const t=vals(m).token.trim();if(t.length<10){toast('Token looks too short');return false}S.smsApi.token=t;
  if(!S.contacts.some(c=>c.source==='eddypay'))[['Eddy Pay Group: Resellers','0700111222'],['Eddy Pay Group: VIP','0711222333']].forEach(([n,num])=>S.contacts.push({id:uid(),name:n,number:num,email:'',source:'eddypay'}));save();render();toast('Eddy Pay connected')}}]);
A.backup=()=>guard('backup',()=>{const parts=[['plans','Data plans & fallbacks'],['clients','Clients'],['contacts','Contacts'],['transactions','Transactions & history'],['settings','Settings, profile & auto replies']];
  modal('Backup',`<p class="sub mb8">Select what to export. The file is protected with your password.</p>${parts.map(([k,l])=>`<div class="row sb mb8"><span>${l}</span>${sw(k,true)}</div>`).join('')}${fld('Backup password',inp('pw','','min 4 characters','password'))}`,[{label:'Cancel'},{label:'Export',cls:'g',onClick:m=>{const v=vals(m);if(v.pw.length<4){toast('Password too short');return false}
    const d={};if(v.plans){d.plans=S.plans;d.fallbacks=S.fallbacks}if(v.clients)d.clients=S.clients;if(v.contacts)d.contacts=S.contacts;if(v.transactions){d.transactions=S.transactions;d.ussdHistory=S.ussdHistory;d.mpesa=S.mpesa;d.schedules=S.schedules}if(v.settings){d.settings=S.settings;d.profile=S.profile;d.autoReply=S.autoReply;d.templates=S.templates}
    download(`bingwa-backup-${new Date().toISOString().slice(0,10)}.bingwa`,JSON.stringify({app:'bingwa',v:1,data:xor(JSON.stringify(d),v.pw)}),'application/octet-stream');toast('Backup exported')}}])});
function xor(s,k){const b=new TextEncoder().encode(s),kb=new TextEncoder().encode(k);for(let i=0;i<b.length;i++)b[i]^=kb[i%kb.length];let o='';b.forEach(x=>o+=String.fromCharCode(x));return btoa(o)}
function unxor(s,k){const r=atob(s),b=new Uint8Array(r.length),kb=new TextEncoder().encode(k);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i)^kb[i%kb.length];return new TextDecoder().decode(b)}
A.restore=()=>guard('backup',()=>pickFile('.bingwa,.json',t=>modal('Restore backup',fld('Backup password',inp('pw','','','password')),[{label:'Cancel'},{label:'Restore',cls:'g',onClick:m=>{try{const f=JSON.parse(t);const d=JSON.parse(unxor(f.data,vals(m).pw));Object.assign(S,d);save();render();toast('Restore complete')}catch(e){toast('Wrong password or invalid backup file');return false}}}])));
A.helpSite=()=>window.open('https://home.bingwastore.com','_blank');
A.editBal=()=>guard('balances',()=>{const b=S.balances;modal('Set balances',fld('Airtime (KES)',inp('airtime',b.airtime,'0.00','number','step="0.01" min="0"'))+fld('Tokens (units)',inp('tokens',b.tokens,'0','number','min="0"'))+fld('Commission (KES)',inp('commission',b.commission,'0.00','number','step="0.01" min="0"')),[{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{const v=vals(m);S.balances={airtime:+(+v.airtime||0).toFixed(2),tokens:Math.max(0,parseInt(v.tokens)||0),commission:+(+v.commission||0).toFixed(2)};save();render();toast('Balances updated')}}])});
A.resetAll=()=>confirmBox('Erase all data and start fresh? This cannot be undone.',()=>{localStorage.removeItem(KEY);load();render();toast('Data reset')},'Reset');

/* ---------- APP SETTINGS ---------- */
R.settings={title:'App Settings',back:true,render(){const s=S.settings;const it=(i,t,sub,act,right='')=>`<div class="set" data-act="${act}"><span class="ms">${i}</span><div class="t">${t}<small>${sub}</small></div>${right}</div>`;
  return `<div style="border-top:1px solid var(--line);margin:0 -12px">${it('data_object','App mode',s.appMode,'setAppMode','<span class="ms s">chevron_right</span>')}${it('palette','Theme',{dark:'Dark',light:'Light',system:'System'}[s.theme]+' (Light / Dark / System)','setTheme','<span class="ms s">arrow_drop_down</span>')}
  ${it('calendar_today','Week start',s.weekStart,'setWeek')}${it('query_stats','Home data range',s.homeRange,'setRange')}${it('language','Language',s.language+' (more coming soon)','setLang')}${it('verified_user','Verified Senders','Manage trusted SMS senders (e.g., M-PESA)','senders')}
  ${it('mark_email_read','Missed Messages','Configure inbox scan on app launch — '+(s.missedScan?'On':'Off'),'setMissed')}${it('auto_delete','Auto-delete Transactions',s.autoDelete,'setAutoDel',`<span class="tiny">Last run: ${s.autoDeleteLast?rel(s.autoDeleteLast):'Never'}</span>`)}
  ${it('tune','Client metrics settings','New, churn and insights thresholds','metrics')}${it('dialpad','Signature learning number','Sample number used while learning USSD signatures: '+h(s.sigNumber),'setSig')}
  ${it('contact_page','Client to Contacts Sync',`Auto-save: ${s.contactSync?'On':'Off'} • ${S.contacts.filter(c=>c.source==='local').length} numbers indexed`,'setSync','<span class="ms s">chevron_right</span>')}${it('smartphone','USSD Setup','Learn and save USSD dialog classes','ussdSettings')}
  ${it('screen_lock_portrait','Screen Management',s.screen+(s.screen==='Off'?' - Normal behavior':'')+'<br>Some devices need screen on for multi-session USSD','setScreen','<span class="ms s">arrow_drop_down</span>')}${it('build','Diagnostics','View logs and network info','diag')}</div>`}};
const pick=(title,key,list,after)=>modal(title,list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<label class="row" style="padding:10px 4px;cursor:pointer"><input type="radio" name="pk" value="${h(v)}" ${String(S.settings[key])===String(v)?'checked':''}> ${h(l)}</label>`}).join(''),[{label:'Cancel'},{label:'OK',cls:'g',onClick:m=>{const c=$('#modal input[name=pk]:checked');if(c){S.settings[key]=c.value;save();after&&after();render()}}}],{nofocus:true});
A.setAppMode=()=>pick('App mode','appMode',[['Standalone','Standalone — this phone does everything'],['Server','Server — executes USSD for paired clients'],['Client','Client — forwards payments to a server phone']]);
A.setTheme=()=>pick('Theme','theme',[['dark','Dark'],['light','Light'],['system','System']]);
A.setWeek=()=>pick('Week start','weekStart',['Sunday','Monday']);A.setRange=()=>pick('Home data range','homeRange',['Daily','Weekly','Monthly','All time']);
A.setLang=()=>pick('Language','language',['English']);A.setScreen=()=>pick('Screen Management','screen',['Off','Keep screen on','Wake screen for USSD']);
A.setAutoDel=()=>pick('Auto-delete Transactions','autoDelete',['Disabled','7 days','30 days','90 days'],autoDelete);
A.setMissed=()=>{S.settings.missedScan=!S.settings.missedScan;save();render();toast('Inbox scan on launch '+(S.settings.missedScan?'on':'off'))};
A.setSync=()=>{S.settings.contactSync=!S.settings.contactSync;save();render();toast('Auto-save '+(S.settings.contactSync?'on':'off'))};
A.setSig=()=>modal('Signature learning number',fld('Sample number',inp('n',S.settings.sigNumber,'07...','tel')),[{label:'Cancel'},{label:'Save',cls:'g',onClick:m=>{S.settings.sigNumber=normPhone(vals(m).n);save();render()}}]);
A.metrics=()=>{const m=S.settings.metrics;modal('Client metrics settings',`${fld('"New" if first seen within (days)',inp('newDays',m.newDays,'','number'))}${fld('"At risk" after inactive (days)',inp('riskDays',m.riskDays,'','number'))}${fld('"Churned" after inactive (days)',inp('churnDays',m.churnDays,'','number'))}${fld('"Dormant" after inactive (days)',inp('dormantDays',m.dormantDays,'','number'))}${fld('"High" spender from (KES)',inp('highSpend',m.highSpend,'','number'))}`,
  [{label:'Cancel'},{label:'Save',cls:'g',onClick:x=>{const v=vals(x);Object.keys(m).forEach(k=>m[k]=Math.max(0,+v[k]||0));if(m.churnDays<=m.riskDays){toast('Churn days must be greater than at-risk days');return false}save();render()}}])};
A.diag=()=>modal('Diagnostics',`<table class="t"><tr><th>Version</th><td>${VERSION}</td></tr><tr><th>Online</th><td>${navigator.onLine?'Yes':'No'}</td></tr><tr><th>Automation</th><td>${S.automation?'Running':'Stopped'}</td></tr><tr><th>Active USSD sessions</th><td>${running}</td></tr><tr><th>Storage used</th><td>${(JSON.stringify(S).length/1024).toFixed(0)} KB</td></tr><tr><th>Plans / Clients</th><td>${S.plans.length} / ${S.clients.length}</td></tr><tr><th>Transactions</th><td>${S.transactions.length}</td></tr><tr><th>User agent</th><td class="tiny">${h(navigator.userAgent)}</td></tr></table>`,[{label:'Copy',cls:'o',onClick:()=>{copy($('#modal .mb').innerText);return false}},{label:'Close'}],{wide:true});

/* ---------- UPDATES ---------- */
R.updates={title:'Updates',render(){return `<div class="card p" style="text-align:center;padding:30px"><span class="ms" style="font-size:48px;color:var(--green2)">system_update</span><div class="big mt">Bingwa ${VERSION}</div><div class="sub mt" id="updMsg">Last checked: ${S.ui.updChecked?rel(S.ui.updChecked):'never'}</div><button class="btn g mt" data-act="checkUpd" id="updBtn"><span class="ms s">refresh</span>Check for updates</button></div>
  <div class="card p"><div class="lbl mb8">What's new in ${VERSION}</div><ul style="padding-left:18px;line-height:1.8" class="sub"><li>Fallback plans with Already-recommended and Purchase-failed triggers</li><li>Portal pairing to manage this device from the web</li><li>Client metrics: new, at-risk, churned, returning</li><li>Transactional auto replies via SIM or SMSHub sender ID</li><li>Encrypted backup &amp; restore</li></ul></div>`}};
A.checkUpd=async()=>{const b=$('#updBtn');b.disabled=true;b.innerHTML='<span class="ms s spin">progress_activity</span>Checking…';await sleep(1200);S.ui.updChecked=now();save();render();toast('You are on the latest version')};

/* ---------- INIT ---------- */
load();autoDelete();
addEventListener('hashchange',()=>{closeMenu();closeModal();render();scrollTo(0,0)});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu();toggleDrawer(false)}});
render();
setInterval(tick,5000);setInterval(()=>{if(['home','transactions','stats','clients'].includes(cur()))softRender()},30000);
if(S.settings.missedScan){const missed=S.mpesa.filter(m=>{const p=parseMpesa(m.body);return p&&!S.transactions.some(t=>t.code===p.code)&&now()-m.ts<3*DAY});if(missed.length)setTimeout(()=>toast(`${missed.length} unprocessed payment(s) found in inbox — open M-PESA Messages and tap ✓ to process`),800)}
</script>
</body>
</html>
